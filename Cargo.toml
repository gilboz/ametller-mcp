[package]
name = "ametller-mcp"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"
repository = "https://github.com/gilboz/ametller-mcp"
description = "Local Rust MCP for Ametller Origen catalog and shopping cart"
readme = "README.md"
include = ["/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml", "/README.md", "/LICENSE", "/NOTICE", "/src/**", "/tests/*.rs", "/tests/fixtures/**", "/docs/**"]

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
fs2 = "0.4"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form"] }
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
rpassword = "7.5"
rust_decimal = "1"
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
